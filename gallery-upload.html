<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Share a photo with the Maelstrom gallery." />
    <title>Maelstrom | Share a photo</title>
    <link rel="stylesheet" href="style.css?v=20260830-gallery-camera" />
  </head>
  <body class="gallery-upload-page site-open">
    <header class="site-header gallery-upload-language-header" aria-label="Language"></header>
    <main class="gallery-upload-shell">
      <section class="gallery-upload-card">
        <span class="brand-symbol gallery-upload-symbol" aria-hidden="true">M</span>
        <h1 data-i18n="joinMaelstromGallery">Be part of the Maelstrom gallery</h1>
        <form id="galleryUploadForm" class="gallery-upload-form">
          <div class="gallery-photo-sources">
            <label class="gallery-photo-source">
              <span data-i18n="takePhoto">Take a photo</span>
              <input id="galleryCamera" type="file" accept="image/jpeg,image/png,image/webp" capture="environment" />
            </label>
            <label class="gallery-photo-source">
              <span data-i18n="chooseExistingPhoto">Choose a photo</span>
              <input id="galleryLibrary" type="file" accept="image/jpeg,image/png,image/webp" />
            </label>
          </div>
          <div class="gallery-upload-preview" id="galleryUploadPreview" hidden>
            <img id="galleryPreviewImage" alt="Selected photo preview" data-i18n-alt="selectedPhotoPreviewAlt" />
          </div>
          <button type="submit" id="galleryUploadButton" data-i18n="sendPhoto">Send the photo</button>
          <p class="gallery-upload-status" id="galleryUploadStatus" role="status" aria-live="polite"></p>
        </form>
        <a class="gallery-upload-return" href="gallery.html" data-i18n="backToGallery">Back to the gallery</a>
      </section>
    </main>
    <script src="i18n.js?v=20260830-gallery-camera"></script>
    <script src="gallery-upload.js?v=20260830-gallery-camera"></script>
  </body>
</html>

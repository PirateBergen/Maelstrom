<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Maelstrom in Bergen. Enter the map and discover the countdown before opening night."
    />
    <title>Maelstrom | Bergen</title>
    <link rel="preload" href="assets/maelstrom-pirate-map.webp" as="image" />
    <link rel="preload" href="assets/maelstrom-logo.webp" as="image" />
    <link rel="preload" href="assets/maelstrom-full-section-bg.jpg" as="image" />
    <link rel="preload" href="assets/parchment-background.jpg" as="image" />
    <link rel="stylesheet" href="style.css?v=20260827-reservation-menu-da" />
  </head>
  <body>
    <main class="gate" aria-label="Maelstrom site entrance" data-i18n-aria="gateAria">
      <div class="sea-haze" aria-hidden="true"></div>

      <section class="map-stage" aria-live="polite">
        <div class="map-orbit" aria-hidden="true">
          <img
            class="map-image"
            src="assets/maelstrom-pirate-map.webp"
            alt=""
            draggable="false"
          />
        </div>
        <div class="abyss-wash" aria-hidden="true"></div>

        <button class="map-disc-button" type="button" aria-expanded="false" aria-label="Turn the map upside down" data-i18n-aria="turnMapAria">
          <svg class="disc-lettering" viewBox="0 0 300 300" aria-hidden="true">
            <defs>
              <path id="lettering-top-path" d="M 44 150 A 106 106 0 0 1 256 150" />
              <path id="lettering-bottom-path" d="M 256 150 A 106 106 0 0 1 44 150" />
            </defs>
            <text class="lettering-top">
              <textPath href="#lettering-top-path" startOffset="50%" text-anchor="middle">UP IS DOWN</textPath>
            </text>
            <text class="lettering-bottom">
              <textPath href="#lettering-bottom-path" startOffset="50%" text-anchor="middle">UP IS DOWN</textPath>
            </text>
          </svg>
          <span class="disc-flip">
            <span class="disc-map"></span>
            <span class="ship-scene" aria-hidden="true">
              <img class="pirate-ship" src="assets/ship.webp" alt="" draggable="false" />
            </span>
          </span>
        </button>

        <div class="countdown" aria-hidden="true">
          <p class="kicker" data-i18n="openingInBergen">Opening in Bergen</p>
          <img class="countdown-logo" src="assets/maelstrom-logo.webp" alt="Maelstrom" draggable="false" />
          <p class="date">September 15, 2026</p>
          <div class="time-grid" role="timer" aria-label="Countdown before opening night" data-countdown-label>
            <span>
              <strong data-unit="days">000</strong>
              <small data-i18n="days">days</small>
            </span>
            <span>
              <strong data-unit="hours">00</strong>
              <small data-i18n="hours">hours</small>
            </span>
            <span>
              <strong data-unit="minutes">00</strong>
              <small data-i18n="minutes">minutes</small>
            </span>
            <span>
              <strong data-unit="seconds">00</strong>
              <small data-i18n="seconds">seconds</small>
            </span>
          </div>
          <a class="admin-preview-link" href="?preview=site&admin=maelstrom" data-i18n="adminPreview">Admin preview</a>
        </div>
      </section>
    </main>

    <main class="full-site" id="site" aria-label="Maelstrom website" hidden>
      <header class="site-header">
        <a class="brand-mark" href="#top" aria-label="Maelstrom home" data-i18n-aria="homeAria">
          <span class="brand-symbol">M</span>
        </a>
        <nav class="site-nav" aria-label="Main navigation" data-i18n-aria="mainNavAria">
          <a href="menu.html" data-i18n="navMenu">Menu</a>
          <a href="reservations.html" data-i18n="navReservations">Reserve</a>
          <a href="qr/results.html" data-i18n="navTierList">Tier list</a>
          <a href="gallery.html" data-i18n="navGallery">Galerie</a>
          <a href="logbook.html" data-i18n="navLogbook">Journal de bord</a>
          <a href="#contact" data-i18n="navContact">Contact</a>
        </nav>
      </header>

      <section class="site-hero" id="top">
        <div class="site-hero-content">
          <img class="site-logo-title" src="assets/maelstrom-logo.webp" alt="Maelstrom" draggable="false" />
        </div>
      </section>

      <div class="abyss-map-block">
        <section class="content-band intro-band" id="gallery">
          <div class="section-heading">
            <h2>Up is down</h2>
          </div>
          <div class="photo-carousel" aria-label="Maelstrom atmosphere photo carousel" data-i18n-aria="carouselAria">
            <button class="carousel-cue carousel-cue-left" type="button" aria-label="Previous photos" data-i18n-aria="previousPhotos"></button>
            <button class="carousel-cue carousel-cue-right" type="button" aria-label="Next photos" data-i18n-aria="nextPhotos"></button>
            <div class="photo-track">
              <figure class="photo-placeholder frame-green tilt-left">
                <span>Photo 01</span>
              </figure>
              <figure class="photo-placeholder frame-gold tall lift-small">
                <span>Photo 02</span>
              </figure>
              <figure class="photo-placeholder frame-dark-wood tilt-right">
                <span>Photo 03</span>
              </figure>
              <figure class="photo-placeholder frame-red compact lift-large">
                <span>Photo 04</span>
              </figure>
              <figure class="photo-placeholder frame-dark-gold-landscape landscape tilt-left">
                <span>Photo 05</span>
              </figure>
              <figure class="photo-placeholder frame-dark-gold lift-small">
                <span>Photo 06</span>
              </figure>
              <figure class="photo-placeholder frame-dark-wood-landscape landscape tilt-right">
                <span>Photo 07</span>
              </figure>
              <figure class="photo-placeholder frame-green tilt-left" aria-hidden="true">
                <span>Photo 01</span>
              </figure>
              <figure class="photo-placeholder frame-gold tall lift-small" aria-hidden="true">
                <span>Photo 02</span>
              </figure>
              <figure class="photo-placeholder frame-dark-wood tilt-right" aria-hidden="true">
                <span>Photo 03</span>
              </figure>
              <figure class="photo-placeholder frame-red compact lift-large" aria-hidden="true">
                <span>Photo 04</span>
              </figure>
              <figure class="photo-placeholder frame-dark-gold-landscape landscape tilt-left" aria-hidden="true">
                <span>Photo 05</span>
              </figure>
              <figure class="photo-placeholder frame-dark-gold lift-small" aria-hidden="true">
                <span>Photo 06</span>
              </figure>
              <figure class="photo-placeholder frame-dark-wood-landscape landscape tilt-right" aria-hidden="true">
                <span>Photo 07</span>
              </figure>
            </div>
          </div>
        </section>

        <section class="content-band contact-band" id="contact">
          <div class="contact-actions">
            <div class="social-links" aria-label="Social links">
              <span class="social-icon social-instagram is-disabled" role="img" aria-label="Instagram coming soon">
                <img src="assets/social-instagram.webp" alt="" draggable="false" />
              </span>
              <span class="social-icon social-tiktok is-disabled" role="img" aria-label="TikTok coming soon">
                <img src="assets/social-tiktok.webp" alt="" draggable="false" />
              </span>
              <span class="social-icon social-youtube is-disabled" role="img" aria-label="YouTube coming soon">
                <img src="assets/social-youtube.webp" alt="" draggable="false" />
              </span>
              <span class="social-icon social-facebook is-disabled" role="img" aria-label="Facebook coming soon">
                <img src="assets/social-facebook.webp" alt="" draggable="false" />
              </span>
            </div>
            <div class="google-review-panel">
              <p class="review-kicker" data-i18n="reviewsTitle">Reviews</p>
              <p data-i18n="reviewsIntro">Share your tale on Google when the Maelstrom listing is live.</p>
              <a class="google-review-link is-disabled" href="#" data-google-review-link aria-disabled="true" data-i18n="googleReviewSoon">
                Google reviews coming soon
              </a>
            </div>
          </div>
        </section>
      </div>

      <div class="photo-lightbox" role="dialog" aria-modal="true" aria-label="Expanded photo" data-i18n-aria="expandedPhoto" hidden>
        <button class="lightbox-close" type="button" aria-label="Close photo" data-i18n-aria="closePhoto"></button>
        <div class="lightbox-stage">
          <figure class="photo-placeholder lightbox-frame">
            <span>Photo</span>
          </figure>
        </div>
      </div>
    </main>

    <script src="i18n.js?v=20260827-reservations"></script>
    <script src="script.js?v=20260827-google-review-link"></script>
  </body>
</html>

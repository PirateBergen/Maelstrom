<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Journal de bord du Maelstrom." />
    <title>Maelstrom | Journal de bord</title>
    <link rel="canonical" href="https://maelstrombergen.com/logbook.html" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Maelstrom | Journal de bord" />
    <meta property="og:description" content="Explore the Maelstrom logbook and the stories behind its signature cocktails." />
    <meta property="og:url" content="https://maelstrombergen.com/logbook.html" />
    <meta property="og:image" content="https://maelstrombergen.com/assets/maelstrom-logo.webp" />
    <link rel="stylesheet" href="style.css?v=20260831-site-improvements" />
  </head>
  <body class="site-open">
    <main class="full-site logbook-page" id="site" aria-label="Journal de bord du Maelstrom">
      <header class="site-header">
        <a class="brand-mark" href="index.html?preview=site#top" aria-label="Maelstrom home" data-i18n-aria="homeAria">
          <span class="brand-symbol">M</span>
        </a>
        <nav class="site-nav" aria-label="Main navigation" data-i18n-aria="mainNavAria">
          <a href="menu.html" data-i18n="navMenu">Menu</a>
          <a href="reservations.html" data-i18n="navReservations">Reserve</a>
          <a href="qr/results.html" data-i18n="navTierList">Tier list</a>
          <a href="gallery.html" data-i18n="navGallery">Galerie</a>
          <a href="logbook.html" data-i18n="navLogbook">Journal de bord</a>
          <a href="index.html?preview=site#contact" data-i18n="navContact">Contact</a>
        </nav>
      </header>

      <section class="content-band logbook-band" aria-label="Journal pages" data-i18n-aria="logbookPagesAria">
        <h1 class="sr-only">Journal de bord du Maelstrom</h1>
        <div class="logbook-book" aria-live="polite">
          <div class="logbook-sheet" data-logbook-sheet></div>
          <button class="logbook-mobile-arrow logbook-mobile-arrow-prev" type="button" data-logbook-prev aria-label="Page precedente" data-i18n-aria="pagePrevious">
            &lt;
          </button>
          <button class="logbook-mobile-arrow logbook-mobile-arrow-next" type="button" data-logbook-next aria-label="Page suivante" data-i18n-aria="pageNext">
            &gt;
          </button>
          <div class="logbook-zoom-controls" aria-label="Zoom">
            <button class="logbook-zoom-button" type="button" data-logbook-zoom-out aria-label="Dézoomer" data-i18n-aria="zoomOut">−</button>
            <button class="logbook-zoom-value" type="button" data-logbook-zoom-reset aria-label="Réinitialiser le zoom" data-i18n-aria="resetZoom">100%</button>
            <button class="logbook-zoom-button" type="button" data-logbook-zoom-in aria-label="Zoomer" data-i18n-aria="zoomIn">+</button>
          </div>
          <div class="logbook-controls">
            <button class="logbook-turn-button" type="button" data-logbook-prev data-i18n="pagePrevious">
              Page precedente
            </button>
            <button class="logbook-turn-button" type="button" data-logbook-next data-i18n="pageNext">
              Page suivante
            </button>
          </div>
          <span class="sr-only" data-logbook-status>Page 1</span>
        </div>
      </section>
    </main>
    <script src="i18n.js?v=20260831-site-improvements"></script>
    <script src="reservations-config.js?v=20260828-newsletter"></script>
    <script src="newsletter.js?v=20260829-force-preview"></script>
    <script src="logbook.js?v=20260828-smart-preload"></script>
  </body>
</html>

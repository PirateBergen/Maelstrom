<!doctype html>
<html lang="nb">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta
      name="description"
      content="Maelstrom signature cocktail tasting tier list."
    />
    <title>Maelstrom | Tasting Tier List</title>
    <link rel="stylesheet" href="../style.css?v=20260831-site-improvements" />
    <link rel="stylesheet" href="tasting.css?v=20260831-site-audit" />
  </head>
  <body class="tasting-body tasting-vote-page">
    <main class="tasting-shell">
      <section class="tasting-hero">
        <div class="tasting-hero-content">
          <h1 data-i18n="rankTheStorm">Rank the Storm</h1>
          <p data-i18n="tastingIntro">
            Rank the cocktails according to your preferences.
          </p>
        </div>
      </section>

      <section class="tasting-board" aria-label="Cocktail ranking" data-i18n-aria="cocktailRankingAria">
        <div class="tier-summary" id="tierSummary" aria-live="polite"></div>
        <div class="cocktail-list" id="cocktailList"></div>

        <form class="taster-form" id="tasterForm">
          <label>
            <span data-i18n="tasterName">Taster name or table</span>
            <input type="text" name="taster" placeholder="Table 7 / Alex / The crew" data-i18n-placeholder="tasterPlaceholder" />
          </label>
          <label>
            <span data-i18n="generalComment">General comment</span>
            <textarea name="note" rows="3" placeholder="Best surprise, too sweet, favorite moment..." data-i18n-placeholder="commentPlaceholder"></textarea>
          </label>
          <button type="submit" data-i18n="submitTierList">Submit tier list</button>
          <p class="save-status" id="saveStatus" role="status"></p>
        </form>
      </section>
    </main>

    <section class="vote-thanks" id="voteThanks" aria-live="polite" aria-label="Vote confirmation" data-i18n-aria="voteConfirmationAria" hidden>
      <div class="vote-thanks-content">
        <img class="vote-thanks-logo" src="../assets/up-is-down-vote.webp" alt="Up is down" loading="lazy" decoding="async" draggable="false" />
        <p class="site-kicker">Up is down</p>
        <h2 data-i18n="thankVote">Thank you for your vote</h2>
        <a class="treasure-button vote-home-button" href="../index.html?preview=site#top">
          <span data-i18n="enterSite">Enter the site</span>
        </a>
      </div>
    </section>

    <script src="../i18n.js?v=20260902-norwegian-default"></script>
    <script src="config.js?v=20260822-i18n-logbook-preload"></script>
    <script src="tasting.js?v=20260822-i18n-logbook-preload"></script>
  </body>
</html>

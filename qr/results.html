<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Maelstrom cocktail tasting results." />
    <title>Maelstrom | Tasting Results</title>
    <link rel="stylesheet" href="../style.css?v=20260827-reservation-menu-da" />
    <link rel="stylesheet" href="tasting.css?v=20260822-i18n-logbook-preload" />
  </head>
  <body class="tasting-body">
    <header class="site-header">
      <a class="brand-mark" href="../index.html?preview=site#top" aria-label="Maelstrom home" data-i18n-aria="homeAria">
        <span class="brand-symbol">M</span>
      </a>
      <nav class="site-nav" aria-label="Main navigation" data-i18n-aria="mainNavAria">
        <a href="../menu.html" data-i18n="navMenu">Menu</a>
        <a href="../reservations.html" data-i18n="navReservations">Reserve</a>
        <a href="results.html" data-i18n="navTierList">Tier list</a>
        <a href="../gallery.html" data-i18n="navGallery">Galerie</a>
        <a href="../logbook.html" data-i18n="navLogbook">Journal de bord</a>
        <a href="../index.html?preview=site#contact" data-i18n="navContact">Contact</a>
      </nav>
    </header>
    <main class="tasting-shell">
      <section class="tasting-hero compact">
        <img class="tasting-map" src="../assets/maelstrom-pirate-map.webp" alt="" draggable="false" />
        <div class="tasting-hero-content">
          <p class="site-kicker" data-i18n="currentLeaderboard">Current leaderboard</p>
          <h1 class="page-title" data-i18n="tastingResults">Tasting Results</h1>
          <p data-i18n="resultsIntro">
            The signature cocktail ranking will appear here when the tasting votes are connected.
          </p>
        </div>
      </section>

      <section class="tasting-board">
        <div class="results-toolbar">
          <div>
            <p class="site-kicker" data-i18n="currentLeaderboard">Current leaderboard</p>
            <h2 data-i18n="signatureRanking">Signature ranking</h2>
          </div>
        </div>
        <div class="leaderboard" id="leaderboard"></div>
        <div class="submission-log" id="submissionLog"></div>
      </section>
    </main>

    <script src="../i18n.js?v=20260827-reservations"></script>
    <script src="config.js?v=20260822-i18n-logbook-preload"></script>
    <script src="tasting.js?v=20260822-i18n-logbook-preload"></script>
